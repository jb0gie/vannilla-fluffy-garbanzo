<!DOCTYPE html>
<html>
<head>
  <title>Basic JavaScript Test</title>
</head>
<body>
  <div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; font-family:monospace;">
    <div>
      <div id="status">Loading basic test...</div>
      <div id="timer">0s</div>
    </div>
  </div>

  <div id="content" style="display:none; padding:20px;">
    <h1>✅ Basic Test Passed!</h1>
    <p>If you see this, JavaScript setTimeouts are working.</p>
  </div>

  <script>
    console.log('=== BASIC JAVASCRIPT TEST ===');
    let startTime = Date.now();

    // Update timer
    const timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('timer').textContent = `${elapsed}s`;
    }, 100);

    // Test basic setTimeout
    setTimeout(() => {
      console.log('✅ 1 second timeout worked');
      document.title = '🟢 JS Working - 1s';
    }, 1000);

    // Test the exact timeout pattern from main page
    setTimeout(() => {
      console.log('✅ 1.5 second timeout worked - this is the one that should hide loader');
      document.title = '🟢 JS Working - 1.5s';

      const loader = document.getElementById('loader');
      const content = document.getElementById('content');

      if (loader && content) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
          content.style.display = 'block';
          document.title = '✅ Basic Test Passed!';
          console.log('✅ Loader hidden and content shown!');
        }, 500);
      } else {
        console.error('❌ Elements not found');
        document.title = '❌ Elements Missing';
      }
    }, 1500);

    console.log('✅ Script setup complete');
  </script>
</body>
</html>
