server {
    listen 80;
    server_name _;

    # HLS MIME types
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    # CORS headers for Decentraland
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Range requests for HLS seeking
    add_header Accept-Ranges "bytes" always;

    # Disable directory listing
    autoindex off;

    # Root directory
    root /app;
    index index.html;

    # Handle CORS preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Wearhaus HLS directory - ensure proper handling
    location /wearhaus/ {
        add_header Cache-Control "no-cache" always;
    }

    # Secure the schizodio directory
    location /schizodio/ {
        location ~* \.(json|png|jpg|jpeg|gif|webp)$ {
        }

        location ~ /schizodio/ {
            return 403;
        }
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.(htaccess|htpasswd|ini|log|sh|inc|bak)$ {
        deny all;
    }

    location ~ ^/(metadata|\.git)/ {
        deny all;
    }

    error_page 403 /index.html;
    error_page 404 /index.html;
}
